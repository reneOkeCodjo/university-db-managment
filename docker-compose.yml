services:
  postgres:
    container_name: postgres_campusdata
    image: postgres:17
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
      POSTGRES_DB: campusdata
    volumes:
      - ./01_campusdata_officiel/sql:/docker-entrypoint-initdb.d
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d campusdata"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - campusdata-network

  pgadmin:
    container_name: pgadmin_campusdata
    image: dpage/pgadmin4:8
    ports:
      - "8080:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@campusdata.com
      PGADMIN_DEFAULT_PASSWORD: root
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - campusdata-network

networks:
  campusdata-network:

volumes:
  postgres_data:
    driver: local
  pgadmin_data:
    driver: local
